services:
  taru:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: taru-server:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TARU_ADMIN_TOKEN: ${TARU_ADMIN_TOKEN:?set TARU_ADMIN_TOKEN}
      TARU_DATABASE_URL: postgres://taru:${TARU_POSTGRES_PASSWORD:?set TARU_POSTGRES_PASSWORD}@postgres:5432/taru
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - type: bind
        source: ../container/postgres.taru.toml
        target: /config/taru.toml
        read_only: true
        bind:
          create_host_path: false
      - taru-data:/data
      - taru-cache:/cache
      - type: bind
        source: ${TARU_MEDIA_ROOT:?set TARU_MEDIA_ROOT}
        target: /media/movies
        read_only: true
        bind:
          create_host_path: false
    entrypoint: ["/usr/bin/tini", "--"]
    command:
      - sh
      - -c
      - taru-server --config /config/taru.toml config-check --create-dirs && exec taru-server --config /config/taru.toml serve
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: taru
      POSTGRES_PASSWORD: ${TARU_POSTGRES_PASSWORD:?set TARU_POSTGRES_PASSWORD}
      POSTGRES_DB: taru
    volumes:
      - taru-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taru -d taru"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  taru-data:
  taru-cache:
  taru-postgres-data:

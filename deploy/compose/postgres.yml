services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: taru
      POSTGRES_PASSWORD: ${TARU_POSTGRES_PASSWORD:?set TARU_POSTGRES_PASSWORD}
      POSTGRES_DB: taru
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - taru-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taru -d taru"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  taru-postgres-data:

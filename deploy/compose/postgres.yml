services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: nako
      POSTGRES_PASSWORD: ${NAKO_POSTGRES_PASSWORD:?set NAKO_POSTGRES_PASSWORD}
      POSTGRES_DB: nako
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nako-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nako -d nako"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nako-postgres-data:

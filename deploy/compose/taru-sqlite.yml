services:
  taru:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: taru-server:local
    restart: unless-stopped
    environment:
      TARU_ADMIN_TOKEN: ${TARU_ADMIN_TOKEN:?set TARU_ADMIN_TOKEN}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - type: bind
        source: ../container/sqlite.taru.toml
        target: /config/taru.toml
        read_only: true
        bind:
          create_host_path: false
      - taru-sqlite-data:/data
      - taru-cache:/cache
      - type: bind
        source: ${TARU_MEDIA_ROOT:?set TARU_MEDIA_ROOT}
        target: /media/movies
        read_only: true
        bind:
          create_host_path: false
    entrypoint: ["/usr/bin/tini", "--"]
    command:
      - sh
      - -c
      - taru-server --config /config/taru.toml config-check --create-dirs && exec taru-server --config /config/taru.toml serve
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  taru-sqlite-data:
  taru-cache:

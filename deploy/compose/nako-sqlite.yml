services:
  nako:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: nako-server:local
    restart: unless-stopped
    environment:
      NAKO_ADMIN_TOKEN: ${NAKO_ADMIN_TOKEN:?set NAKO_ADMIN_TOKEN}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - type: bind
        source: ../container/sqlite.nako.toml
        target: /config/nako.toml
        read_only: true
        bind:
          create_host_path: false
      - nako-sqlite-data:/data
      - nako-cache:/cache
      - type: bind
        source: ${NAKO_MEDIA_ROOT:?set NAKO_MEDIA_ROOT}
        target: /media/movies
        read_only: true
        bind:
          create_host_path: false
    entrypoint: ["/usr/bin/tini", "--"]
    command:
      - sh
      - -c
      - nako-server --config /config/nako.toml config-check --create-dirs && exec nako-server --config /config/nako.toml serve
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  nako-sqlite-data:
  nako-cache:

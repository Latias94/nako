name: release-gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    name: fast release gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install TypeScript SDK dependencies
        run: npm ci --prefix sdk/typescript

      - name: Install Admin Web dependencies
        run: npm ci --prefix apps/admin-web

      - name: Run fast release gate
        run: bash scripts/release-gate.sh --mode fast

  postgres-contracts:
    name: postgres managed artwork contracts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nako
          POSTGRES_PASSWORD: nako
          POSTGRES_DB: nako_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nako -d nako_contract"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NAKO_TEST_POSTGRES_URL: postgres://nako:nako@127.0.0.1:5432/nako_contract
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run PostgreSQL contract harness
        run: bash scripts/postgres-contract-harness.sh --suite managed-artwork --require-tooling

  self-host-smoke:
    name: self-host sqlite smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run self-host smoke
        run: bash scripts/self-host-smoke.sh --backend sqlite

  api-sdk-redaction:
    name: api sdk redaction gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install TypeScript SDK dependencies
        run: npm ci --prefix sdk/typescript

      - name: Install Admin Web dependencies
        run: npm ci --prefix apps/admin-web

      - name: Run API SDK redaction gate
        run: bash scripts/release-gate.sh --mode api

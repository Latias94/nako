name: release-package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package-linux:
    name: package linux nako-server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Package release artifact
        run: bash scripts/package-release.sh

      - name: Upload package artifacts
        uses: actions/upload-artifact@v6
        with:
          name: nako-server-release
          path: |
            target/package-release/nako-server-v*.tar.gz
            target/package-release/*.release-manifest.json
            target/package-release/SHA256SUMS

      - name: Create GitHub Release draft
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            target/package-release/nako-server-v*.tar.gz
            target/package-release/*.release-manifest.json
            target/package-release/SHA256SUMS

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.95"
authors = ["Mingzhen Zhuang <superfrankie621@gmail.com>"]
description = "An open-source, self-hosted media home for films, shows, anime, and personal collections."
license = "AGPL-3.0-or-later"
repository = "https://github.com/Latias94/nako"
homepage = "https://github.com/Latias94/nako"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8"
bitflags = { version = "2", features = ["serde"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.8"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uniffi = "0.31.1"
uuid = { version = "1", features = ["serde", "v4", "v7"] }

[workspace.dependencies.tempfile]
version = "3"

[workspace.dependencies.pollster]
version = "0.4"

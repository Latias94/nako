[package]
name = "nako"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Public Rust SDK entry point for Nako protocols and addon integration."
license = "Apache-2.0 OR MIT"
readme = "README.md"
keywords = ["nako", "media-server", "addons", "sdk"]
categories = ["api-bindings", "web-programming"]

[lints]
workspace = true

[features]
default = []
addon-client = ["dep:nako-addon-client"]

[dependencies]
nako-addon-protocol = { path = "../nako-addon-protocol", version = "0.1.0-alpha.2" }
nako-addon-client = { path = "../nako-addon-client", version = "0.1.0-alpha.2", optional = true }

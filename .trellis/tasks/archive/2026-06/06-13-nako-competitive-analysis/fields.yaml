topic: Nako competitive analysis against Jellyfin and Plex
fields:
  - name: product_positioning
    description: How the product describes itself, its target users, and its trust model.
    detail_level: detailed
  - name: current_maturity
    description: Release status, stability claims, and production readiness.
    detail_level: moderate
  - name: core_library_workflow
    description: Library setup, scan, indexing, browse, search, and repair workflow.
    detail_level: detailed
  - name: metadata_model
    description: Metadata providers, local metadata, NFO, artwork, identity mapping, and conflict handling.
    detail_level: detailed
  - name: playback_model
    description: Direct Play, remux/direct stream, transcode, hardware acceleration, and client capability handling.
    detail_level: detailed
  - name: remote_access
    description: LAN/remote endpoint story, router/proxy/tunnel assumptions, and diagnostics.
    detail_level: moderate
  - name: extension_model
    description: Plugins, Addons, APIs, sidecars, permissions, lifecycle, and trust boundaries.
    detail_level: detailed
  - name: client_ecosystem
    description: Web, mobile, TV, casting, native app coverage, and SDK readiness.
    detail_level: moderate
  - name: operator_experience
    description: Setup, configuration, diagnostics, jobs, repairs, backups, and day-2 operations.
    detail_level: detailed
  - name: differentiators
    description: Areas where Nako should intentionally diverge or lead.
    detail_level: detailed
  - name: gaps_and_risks
    description: Missing product capabilities, overclaiming risks, and strategic tradeoffs.
    detail_level: detailed
uncertain:
  - Plex current extension platform details beyond official legacy/manual plugin docs.
  - Current Plex Pass entitlement boundaries and pricing details.
  - Jellyfin feature state outside official docs and checked-out server repo.

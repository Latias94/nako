topic: "Nako self-hosted media server product competitive analysis"
created_at: "2026-06-13"
language: "zh-CN"

field_categories:
  - name: "Basic Identity"
    description: "产品基本事实，用于避免把直接竞品、相邻工具和生态组件混成一类。"
    fields:
      - name: "name"
        description: "产品或项目名称。"
        detail_level: "brief"
      - name: "category"
        description: "核心媒体服务器、客户端媒体中心、照片服务器、音乐服务器、自动化生态、统计监控等分类。"
        detail_level: "moderate"
      - name: "ecosystem_role"
        description: "在用户媒体工作流中的角色：server、client、request manager、subtitle automation、transcode automation、analytics、cleanup、live TV 等。"
        detail_level: "detailed"
      - name: "project_status"
        description: "商业产品、开源项目、社区工具、稳定版、alpha/beta、维护活跃度。"
        detail_level: "moderate"
      - name: "license_or_business_model"
        description: "开源许可证、商业授权、订阅、永久授权、捐赠、product key 或混合模式。"
        detail_level: "moderate"

  - name: "Product Positioning"
    description: "产品面向谁、解决什么任务、在哪些场景比替代品更有说服力。"
    fields:
      - name: "target_users"
        description: "家庭影音用户、NAS 用户、影音发烧友、自动化玩家、家庭照片用户、音乐/有声书用户、管理员/运维用户等。"
        detail_level: "detailed"
      - name: "primary_jobs_to_be_done"
        description: "用户雇佣该产品完成的核心任务，如管理影视库、远程播放、同步照片、请求入库、字幕补齐、转码整理。"
        detail_level: "detailed"
      - name: "positioning_claims"
        description: "官网、README 或文档中的核心定位话术。"
        detail_level: "moderate"
      - name: "key_success_factors"
        description: "在该细分市场胜出的关键条件，如客户端覆盖、播放可靠性、元数据准确度、自动化集成、部署简单。"
        detail_level: "detailed"

  - name: "Media Domain Coverage"
    description: "比较媒体域广度和每个域的深度，避免用视频能力误判照片/音乐/阅读能力。"
    fields:
      - name: "supported_media_domains"
        description: "movies、series、anime、home video、photos、music、audiobooks、podcasts、comics、ebooks、online video、IPTV 等。"
        detail_level: "detailed"
      - name: "domain_depth"
        description: "每个媒体域是否只是文件浏览，还是有专用元数据、进度、客户端和工作流。"
        detail_level: "detailed"
      - name: "library_model"
        description: "库、文件夹、collection、playlist、series/season/episode、album/track、book/series 等建模方式。"
        detail_level: "detailed"

  - name: "Library And Metadata"
    description: "扫描、识别、元数据、图片、NFO/sidecar 和治理流程。"
    fields:
      - name: "scan_and_intake"
        description: "全量扫描、增量 watcher、稳定文件判断、移动/重命名处理、远程存储处理。"
        detail_level: "detailed"
      - name: "local_inference_and_naming"
        description: "从路径、文件名、目录结构和探测事实推断媒体结构的能力。"
        detail_level: "detailed"
      - name: "metadata_providers"
        description: "内置/插件元数据来源、provider ID、候选结果、冲突处理、地区语言支持。"
        detail_level: "detailed"
      - name: "local_metadata_authority"
        description: "NFO、sidecar artwork、本地编辑、字段锁、provider 覆盖策略和 round-trip 能力。"
        detail_level: "detailed"
      - name: "artwork_pipeline"
        description: "海报、背景图、缩略图、候选图片、派生尺寸、缓存、选择和导出。"
        detail_level: "detailed"
      - name: "collections_and_curation"
        description: "集合、榜单、播放列表、海报覆盖层、标签、自动策展和人工治理。"
        detail_level: "moderate"

  - name: "Playback And Clients"
    description: "播放链路、客户端覆盖和播放体验。"
    fields:
      - name: "client_surfaces"
        description: "Web、Desktop、iOS、Android、Android TV、Apple TV、Roku、Tizen、webOS、Kodi 插件、第三方客户端。"
        detail_level: "detailed"
      - name: "direct_play_remux_transcode"
        description: "Direct Play、Direct Stream/Remux、Transcode 的决策方式、解释能力和降级路径。"
        detail_level: "detailed"
      - name: "codec_hdr_audio_subtitle_support"
        description: "HDR tone mapping、音频转码/降混、字幕 sidecar/burn-in、章节、音轨选择、ASS/PGS 等。"
        detail_level: "detailed"
      - name: "casting_and_renderer_support"
        description: "Chromecast、DLNA、AirPlay、远程控制、renderer target、cast-safe transport。"
        detail_level: "detailed"
      - name: "offline_sync_downloads"
        description: "移动端离线、下载、同步、转码预生成和权限限制。"
        detail_level: "moderate"
      - name: "live_tv_linear_experience"
        description: "Live TV、DVR、EPG、M3U/IPTV、虚拟频道、连续播放和电视化体验。"
        detail_level: "moderate"

  - name: "Addon And Ecosystem"
    description: "扩展模型、生态规模、权限边界、分发和副作用控制，是 Nako 的核心差异化区域。"
    fields:
      - name: "extension_model"
        description: "in-process plugin、HTTP addon、sidecar、SDK、script、webhook、external automation 的扩展模型。"
        detail_level: "detailed"
      - name: "extension_trust_boundary"
        description: "崩溃隔离、权限模型、token/grant、library scope、manifest validation、host-owned writes、审核机制。"
        detail_level: "detailed"
      - name: "addon_distribution"
        description: "官方目录、社区市场、手动安装、Docker/systemd、应用商店、版本兼容策略。"
        detail_level: "detailed"
      - name: "side_effect_policy"
        description: "插件/Addon 是否能写数据库、写媒体库文件、下载资源、修改元数据、执行外部任务，以及是否经过 host policy。"
        detail_level: "detailed"
      - name: "ecosystem_integrations"
        description: "与 Servarr、Bazarr、Seerr、Kometa、Tdarr、Tautulli/Jellystat、Maintainerr、IPTV 工具等的集成程度。"
        detail_level: "detailed"

  - name: "Operations And Self Hosting"
    description: "真实部署、升级、诊断和运维成熟度。"
    fields:
      - name: "deployment_modes"
        description: "源码、Docker/Compose、NAS、TrueNAS、unRAID、Proxmox、Kubernetes、Windows/macOS/Linux 包。"
        detail_level: "moderate"
      - name: "upgrade_backup_restore"
        description: "升级破坏性、备份/恢复、迁移、数据库支持、配置管理。"
        detail_level: "detailed"
      - name: "observability_and_diagnostics"
        description: "健康检查、日志、指标、诊断包、队列压力、转码/存储/插件诊断、错误红action。"
        detail_level: "detailed"
      - name: "resource_management"
        description: "CPU/GPU/disk/network 队列、资源预算、硬件转码探测、失败重试、调度和隔离。"
        detail_level: "detailed"
      - name: "remote_access"
        description: "LAN-only、反代、HTTPS、DDNS、VPN/Tailscale、Cloudflare Tunnel、内建中继、账号依赖。"
        detail_level: "detailed"
      - name: "security_posture"
        description: "认证授权、多用户、库权限、token、插件权限、远程暴露风险、安全公告和默认配置安全性。"
        detail_level: "detailed"

  - name: "Data Portability And Migration"
    description: "用户从其他系统迁移或并行运行时最关心的状态可携带性。"
    fields:
      - name: "nfo_and_sidecar_portability"
        description: "NFO、sidecar artwork、字幕、provider IDs、local edits 的导入导出和 round-trip。"
        detail_level: "detailed"
      - name: "user_state_portability"
        description: "watched state、playback progress、ratings、favorites、playlists、collections、history 的迁移/同步。"
        detail_level: "detailed"
      - name: "interoperability"
        description: "公共 API、客户端 SDK、第三方工具兼容、Webhook、导入导出格式。"
        detail_level: "moderate"

  - name: "Monetization And Gates"
    description: "商业模式和功能门控会强烈影响用户迁移动机。"
    fields:
      - name: "pricing"
        description: "免费、订阅、终身授权、产品 key、企业/家庭套餐、移动端购买等。"
        detail_level: "moderate"
      - name: "feature_gates"
        description: "远程播放、硬件转码、移动下载、DVR、客户端、用户数、备份、ML 是否被门控。"
        detail_level: "detailed"
      - name: "cloud_account_dependency"
        description: "账号登录、云发现、远程访问、设备绑定、付费验证是否依赖中心化服务。"
        detail_level: "detailed"

  - name: "Legal Policy And Risk"
    description: "资源搜索、IPTV、yt-dlp、torrent/debrid、成人内容、metadata scraping 等需要单独标记风险。"
    fields:
      - name: "legal_policy_boundary"
        description: "产品如何界定合法内容、自带内容、第三方 addon、插件目录审核、下载/流媒体责任边界。"
        detail_level: "detailed"
      - name: "provider_terms_risk"
        description: "元数据 provider、图片、歌词、字幕、在线视频、IPTV、站点抓取的条款风险。"
        detail_level: "moderate"
      - name: "abuse_and_moderation_risk"
        description: "公开分享、联邦、资源搜索、下载执行、通知/Webhook、远程访问可能引入的滥用面。"
        detail_level: "moderate"

  - name: "Community And Market Signals"
    description: "判断生态势能和 12-18 个月威胁。"
    fields:
      - name: "release_cadence"
        description: "近年发布节奏、稳定版、重大版本、维护连续性。"
        detail_level: "moderate"
      - name: "community_health"
        description: "贡献者、issue/PR 活跃度、文档质量、插件/客户端数量、论坛/Discord 活跃度。"
        detail_level: "moderate"
      - name: "recent_strategic_moves"
        description: "2024 以后重要产品变化、定价变化、稳定版、合并、平台支持变化、生态工具成熟化。"
        detail_level: "detailed"
      - name: "user_pain_signals"
        description: "公开 issue、论坛、release notes、迁移讨论中反复出现的痛点。"
        detail_level: "detailed"

  - name: "Nako Strategy Mapping"
    description: "把竞品事实转成 Nako 产品判断。"
    fields:
      - name: "nako_differentiation_opportunities"
        description: "Nako 可以明显不同或更好的机会点。"
        detail_level: "detailed"
      - name: "nako_parity_requirements"
        description: "用户会默认要求 Nako 具备的 Jellyfin/Plex-class 基线能力。"
        detail_level: "detailed"
      - name: "nako_do_not_chase"
        description: "不适合 Nako 当前阶段追逐的能力、生态或商业承诺。"
        detail_level: "detailed"
      - name: "twelve_to_eighteen_month_risks"
        description: "未来 12-18 个月最可能影响 Nako 采用的竞品威胁、生态变化和技术风险。"
        detail_level: "detailed"

uncertain:
  - "market_share_or_user_base"
  - "exact_active_install_count"
  - "paid_conversion_or_revenue"
  - "private_roadmap"
  - "non_public_security_incidents"
  - "unverified_user_sentiment"
  - "legal_interpretation"

source_policy:
  preferred_sources:
    - "official_site"
    - "official_docs"
    - "official_pricing_page"
    - "github_repo"
    - "github_releases"
    - "project_blog"
    - "Nako local docs"
    - "Nako official addon repository"
  avoid:
    - "unattributed forum claims as facts"
    - "copying reference source code"
    - "license conclusions without legal review"

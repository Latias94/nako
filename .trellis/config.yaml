  nako-client:
    path: crates/nako-client
  nako-client-cli:
    path: crates/nako-client-cli
  nako-client-core:
    path: crates/nako-client-core
  nako-client-protocol:
    path: crates/nako-client-protocol
  nako-client-uniffi:
    path: crates/nako-client-uniffi
  nako-core:
    path: crates/nako-core
  nako-db:
